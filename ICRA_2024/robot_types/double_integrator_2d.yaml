dynamics: double_integrator_2d
distance_weights: [1, 1, 0.5, 0.5]  # x, y, vx, vy
dim_state: 4 # x, y, vx, vy
dim_action: 2 # ax, ay [m/s2]
# state bounds
max_vel: [0.5, 0.5] # vx, vy
min_vel: [-0.1, -0.1] # vx, vy
# control bounds
max_acc: [2.0, 2.0] # ax, ay
min_acc: [-2.0, -2.0] # ax, ay
shape:
  type: sphere
  radius: 0.25